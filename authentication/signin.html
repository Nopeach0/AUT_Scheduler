<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/assets/images/logo.png">

    <title>Signin</title>

    <!-- Bootstrap core CSS -->
    <link href="/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="signin.css" rel="stylesheet">
</head>

<body class="text-center">
    <form class="form-signin" id="signinForm">
        <img class="mb-4" src="/assets/images/logo.png" alt="logo" width="100" height="100">
        <h1 class="h3 mb-3 font-weight-normal">Please sign in</h1>
        <label for="inputEmail" class="sr-only">Email address</label>
        <input type="email" id="inputEmail" name="email" class="form-control" placeholder="Email address" required autofocus>
        <label for="inputPassword" class="sr-only">Password</label>
        <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Password" required>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <label class="mb-0">
                <input type="checkbox" name="remember" value="1"> Remember me
            </label>
            <a href="forgot-password.html">Forgot password?</a>
        </div>
        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
        <button class="btn btn-lg btn-primary btn-block" type="submit" id="signInBtn">Sign in</button>
        <br /><a href="register.html">Register account</a>
    </form>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn      = document.getElementById('signInBtn');
            const errorDiv = document.getElementById('loginError');

            btn.disabled    = true;
            btn.textContent = 'Signing in...';
            errorDiv.classList.add('d-none');

            const data = new FormData(this);

            try {
                const res = await fetch('/api/auth/login.php', { method: 'POST', body: data });

                if (!res.ok) {
                    throw new Error('Server error (' + res.status + ')');
                }

                const json = await res.json();

                if (json.success) {
                    window.location.href = '/index.html';
                } else {
                    errorDiv.textContent = json.error || 'Login failed';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.textContent = err.message === 'Failed to fetch'
                    ? 'Could not connect to server. Make sure the server is running.'
                    : err.message;
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>

</html>
