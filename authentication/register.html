<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — Kea Buddy</title>
    <link rel="icon" href="../assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/app.css" rel="stylesheet">
    <style>
        /* dack mode styles */
        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }

        body.dark-mode .navbar {
            background-color: #1e1e1e !important;
            border-bottom: 1px solid #333;
        }

        body.dark-mode .card,
        body.dark-mode .app-card,
        body.dark-mode .auth-card {
            background-color: #1e1e1e !important;
            border-color: #333 !important;
            color: #e0e0e0 !important;
        }

        body.dark-mode .form-control {
            background-color: #2d2d2d !important;
            border-color: #444 !important;
            color: #e0e0e0 !important;
        }
        body.dark-mode .form-control::placeholder {
            color: #888 !important;
        }

        body.dark-mode .text-muted {
            color: #aaa !important;
        }
        body.dark-mode .fw-bold,
        body.dark-mode .fw-semibold {
            color: #fff !important;
        }

        body.dark-mode .btn-primary {
            background-color: #1976d2 !important;
            border-color: #1976d2 !important;
        }
        body.dark-mode .btn-outline-light {
            color: #fff !important;
            border-color: #ccc !important;
        }

        body.dark-mode .alert-danger {
            background-color: #4a2a2a !important;
            border-color: #6d3a3a !important;
            color: #ffb3b3 !important;
        }
        body.dark-mode .alert-success {
            background-color: #2a4a2a !important;
            border-color: #3a6d3a !important;
            color: #b3ffb3 !important;
        }

        body.dark-mode .progress {
            background-color: #333 !important;
        }

        body.dark-mode .site-footer {
            background-color: #1e1e1e !important;
            color: #ccc !important;
        }

        #darkModeBtn {
            background: transparent;
            border: 1px solid #ced4da;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        body.dark-mode #darkModeBtn {
            border-color: #6c757d;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">&#128038; Kea Buddy</a>
        <div class="d-flex gap-2">
            <a href="signin.html" class="btn btn-outline-light btn-sm">Sign in</a>
            <button id="darkModeBtn" class="btn btn-sm">🌙</button>
        </div>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="card app-card">
            <div class="card-body text-center">

                <img src="../assets/images/logo.png" alt="Kea Buddy logo" class="auth-logo">
                <h1 class="h4 fw-bold mb-1">Create your account</h1>
                <p class="text-muted small mb-4">Free for AUT students — sync your schedule anywhere</p>

                <div id="errorAlert"   class="alert alert-danger  text-start py-2 d-none" role="alert"></div>
                <div id="successAlert" class="alert alert-success text-start py-2 d-none" role="alert"></div>

                <form id="registerForm" novalidate>
                    <div class="mb-3 text-start">
                        <label for="inputName" class="form-label fw-semibold">Full name</label>
                        <input type="text" id="inputName" name="full_name"
                               class="form-control" placeholder="Jane Smith"
                               autocomplete="name" required autofocus>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="inputEmail" class="form-label fw-semibold">Email address</label>
                        <input type="email" id="inputEmail" name="email"
                               class="form-control" placeholder="jsmith@aut.ac.nz"
                               autocomplete="email" required>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="inputPassword" class="form-label fw-semibold">Password</label>
                        <input type="password" id="inputPassword" name="password"
                               class="form-control" placeholder="Min. 8 characters"
                               autocomplete="new-password" required minlength="8">
                        <!-- Live strength indicator -->
                        <div class="progress mt-2" style="height:4px">
                            <div id="strengthBar" class="progress-bar" style="width:0%"></div>
                        </div>
                        <small id="strengthLabel" class="text-muted"></small>
                    </div>

                    <div class="mb-4 text-start">
                        <label for="inputConfirm" class="form-label fw-semibold">Confirm password</label>
                        <input type="password" id="inputConfirm" name="confirm_password"
                               class="form-control" placeholder="Repeat your password"
                               autocomplete="new-password" required>
                    </div>

                    <button class="btn btn-primary w-100" type="submit" id="registerBtn">
                        Create account
                    </button>
                </form>

                <hr class="my-4">
                <p class="small text-muted mb-0">
                    Already have an account?
                    <a href="signin.html" class="fw-semibold">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer">&copy; 2026 Kea Buddy &mdash; Auckland University of Technology</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/**
 * register.html — client-side registration handler
 *
 * Features:
 *  - Live password-strength indicator
 *  - Client-side confirm-password match check (avoids round-trip)
 *  - Submits via fetch; always parses JSON regardless of HTTP status
 *    so backend error details are visible (including 5xx DB errors)
 */

// ── Password strength indicator ──────────────────────────────────
document.getElementById('inputPassword').addEventListener('input', function () {
    const pass  = this.value;
    const bar   = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');

    let score = 0;
    if (pass.length >= 8)          score++;
    if (/[A-Z]/.test(pass))        score++;
    if (/[0-9]/.test(pass))        score++;
    if (/[^A-Za-z0-9]/.test(pass)) score++;

    const levels = [
        { w: '0%',   cls: '',           text: '' },
        { w: '25%',  cls: 'bg-danger',  text: 'Weak' },
        { w: '50%',  cls: 'bg-warning', text: 'Fair' },
        { w: '75%',  cls: 'bg-info',    text: 'Good' },
        { w: '100%', cls: 'bg-success', text: 'Strong' },
    ];

    const lvl = levels[score];
    bar.style.width = lvl.w;
    bar.className   = 'progress-bar ' + lvl.cls;
    label.textContent = lvl.text;
});

// ── Form submission ───────────────────────────────────────────────
document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btn    = document.getElementById('registerBtn');
    const errDiv = document.getElementById('errorAlert');
    const okDiv  = document.getElementById('successAlert');

    errDiv.classList.add('d-none');
    okDiv.classList.add('d-none');

    // Client-side password match check
    const pass    = document.getElementById('inputPassword').value;
    const confirm = document.getElementById('inputConfirm').value;
    if (pass !== confirm) {
        errDiv.textContent = 'Passwords do not match.';
        errDiv.classList.remove('d-none');
        return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Creating account…';

    try {
        const res = await fetch('../api/auth/register.php', {
            method:      'POST',
            body:        new FormData(this),
            credentials: 'same-origin',
        });

        let json;
        try {
            json = await res.json();
        } catch {
            throw new Error('Unexpected server response. Please try again.');
        }

        if (json.success) {
            okDiv.textContent = 'Account created! Redirecting to your dashboard…';
            okDiv.classList.remove('d-none');
            setTimeout(() => { window.location.href = '../index.html'; }, 800);
        } else {
            errDiv.textContent = json.error || 'Registration failed. Please try again.';
            errDiv.classList.remove('d-none');
        }
    } catch (err) {
        errDiv.textContent = err.message.includes('fetch')
            ? 'Cannot reach the server. Check your internet connection.'
            : err.message;
        errDiv.classList.remove('d-none');
    } finally {
        btn.disabled  = false;
        btn.innerHTML = 'Create account';
    }
});
// ── Dark mode toggle ─────────────────────────────────────────────
const darkModeBtn = document.getElementById('darkModeBtn');
const body = document.body;

function initDarkMode() {
  const isDark = localStorage.getItem('darkMode') === 'true';
  if (isDark) {
    body.classList.add('dark-mode');
    darkModeBtn.textContent = '☀️';
  }
}

darkModeBtn.addEventListener('click', () => {
  body.classList.toggle('dark-mode');
  const isDark = body.classList.contains('dark-mode');
  darkModeBtn.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('darkMode', isDark);
});

document.addEventListener('DOMContentLoaded', initDarkMode);
</script>
</body>
</html>
