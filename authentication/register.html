<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/assets/images/logo.png">

    <title>Register</title>

    <!-- Bootstrap core CSS -->
    <link href="/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="signin.css" rel="stylesheet">
</head>

<body class="text-center">
    <form class="form-signin">
        <img class="mb-4" src="/assets/images/logo.png" alt="logo" width="100" height="100">
        <h1 class="h3 mb-3 font-weight-normal">Create an account</h1>

        <label for="inputName" class="sr-only">Full Name</label>
        <input type="text" id="inputName" class="form-control mb-2" placeholder="Full name" required autofocus>

        <label for="inputEmail" class="sr-only">Email address</label>
        <input type="email" id="inputEmail" class="form-control mb-2" placeholder="Email address" required>

        <label for="inputPassword" class="sr-only">Password</label>
        <input type="password" id="inputPassword" class="form-control mb-2" placeholder="Password" required>

        <label for="inputConfirmPassword" class="sr-only">Confirm Password</label>
        <input type="password" id="inputConfirmPassword" class="form-control mb-3" placeholder="Confirm password" required>

        <button class="btn btn-lg btn-primary btn-block" type="button" onclick="window.location.href='../index.html'">Register</button>

        <p class="mt-3">Already have an account? <a href="signin.html">Sign in</a></p>
    </form>
</body>

</html>
