<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../assets/images/logo.png">

    <title>Register</title>

    <!-- Bootstrap core CSS -->
    <link href="../dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="signin.css" rel="stylesheet">
</head>

<body class="text-center">
    <form class="form-signin" id="registerForm">
        <img class="mb-4" src="../assets/images/logo.png" alt="logo" width="100" height="100">
        <h1 class="h3 mb-3 font-weight-normal">Create an account</h1>

        <label for="inputName" class="sr-only">Full Name</label>
        <input type="text" id="inputName" name="full_name" class="form-control mb-2" placeholder="Full name" required autofocus>

        <label for="inputEmail" class="sr-only">Email address</label>
        <input type="email" id="inputEmail" name="email" class="form-control mb-2" placeholder="Email address" required>

        <label for="inputPassword" class="sr-only">Password</label>
        <input type="password" id="inputPassword" name="password" class="form-control mb-2" placeholder="Password" required>

        <label for="inputConfirmPassword" class="sr-only">Confirm Password</label>
        <input type="password" id="inputConfirmPassword" name="confirm_password" class="form-control mb-3" placeholder="Confirm password" required>

        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
        <button class="btn btn-lg btn-primary btn-block" type="submit" id="registerBtn">Register</button>

        <p class="mt-3">Already have an account? <a href="signin.html">Sign in</a></p>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn      = document.getElementById('registerBtn');
            const errorDiv = document.getElementById('registerError');

            btn.disabled    = true;
            btn.textContent = 'Registering...';
            errorDiv.classList.add('d-none');

            const data = new FormData(this);

            try {
                const res = await fetch('../api/auth/register.php', { method: 'POST', body: data });

                if (!res.ok) {
                    throw new Error('Server error (' + res.status + ')');
                }

                const json = await res.json();

                if (json.success) {
                    window.location.href = '../index.html';
                } else {
                    errorDiv.textContent = json.error || 'Registration failed';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.textContent = err.message === 'Failed to fetch'
                    ? 'Could not connect to server. Make sure the server is running.'
                    : err.message;
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Register';
            }
        });
    </script>
</body>

</html>
